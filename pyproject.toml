[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-roco"
version = "0.1.0"
description = "Evaluating and fine-tuning OpenAI CLIP on radiology image-caption pairs (ROCO)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=1.7.1",
    "torchvision",
    "numpy",
    "pandas",
    "matplotlib",
    "pillow",
    "pyyaml",
    "tqdm",
    "ftfy",
    "regex",
    "scikit-image",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
